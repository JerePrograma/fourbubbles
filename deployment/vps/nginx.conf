map $http_x_forwarded_proto $public_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    location = /health {
        access_log off;
        proxy_pass http://$backend_upstream/api/actuator/health/readiness;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /fourbubbles { return 308 /fourbubbles/; }

    location ~ ^/fourbubbles-api/api/(actuator|swagger-ui|v3/api-docs)(/|$) { return 404; }

    location /fourbubbles-api/api/ {
        rewrite ^/fourbubbles-api(/api/.*)$ $1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $public_proto;
    }

    location ~ /\. { return 404; }

    location /fourbubbles/assets/ {
        try_files $uri =404;
    }

    location /fourbubbles/ {
        try_files $uri $uri/ /fourbubbles/index.html;
    }

    location / { return 404; }
}
